[project]
name = "crimson-headless-passkey"
version = "0.3.0"
description = "Automated passkey (WebAuthn) sign-in for Okta using Playwright and a Chrome DevTools virtual authenticator."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ventz Petkov" }]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "keyring>=25",
    "playwright>=1.58",
]
keywords = ["passkey", "webauthn", "fido2", "okta", "playwright", "sso", "automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
    "Operating System :: MacOS",
    "Topic :: Security",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/ventz/crimson-headless-passkey"
Documentation = "https://github.com/ventz/crimson-headless-passkey/tree/main/docs"
Issues = "https://github.com/ventz/crimson-headless-passkey/issues"
Changelog = "https://github.com/ventz/crimson-headless-passkey/blob/main/CHANGELOG.md"

[project.scripts]
crimson-headless-passkey = "crimson_headless_passkey.cli:main"
harvard-fetch = "crimson_headless_passkey.cli:fetch_main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

# An explicit allowlist, so local files (CLAUDE.md, credentials, temp files) can
# never ship in a release no matter what a given clone's ignore rules say.
[tool.hatch.build.targets.sdist]
only-include = [
    "src",
    "tests",
    "docs",
    "examples",
    "README.md",
    ".env.example",
    "LICENSE",
    "SECURITY.md",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "pyproject.toml",
]

[tool.hatch.build.targets.wheel]
packages = ["src/crimson_headless_passkey"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["browser: launches a real browser (skipped when none is installed)"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
